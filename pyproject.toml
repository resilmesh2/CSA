[tool.poetry]
name = "csa-component"
version = "0.1.0"
description = "This package contains implementation of critical service awareness component."
authors = ["ResilMesh"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
temporalio = "^1.17.0"
pyyaml = "^6.0.2"
dacite = "^1.9.2"
httpx = "^0.28.1"
whitenoise = "^6.7.0"
neo4j = "^5.28.1"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
pyrefly = ">=0.45.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
